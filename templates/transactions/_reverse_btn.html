{% load audit_tags %}
{% if request.user|can_reverse %}
  {% if txn|is_reversible %}
  <a href="{% url 'core:transaction_reverse' txn.id %}"
     onclick="event.stopPropagation()"
     title="Reverse this transaction"
     class="inline-flex items-center justify-center w-7 h-7 rounded text-red-600 hover:bg-red-100 dark:text-red-400 dark:hover:bg-red-900/40 transition-colors"
     aria-label="Reverse transaction">
    <i class="fas fa-undo text-xs"></i>
  </a>
  {% elif txn.status == 'reversed' %}
  <span title="Already reversed"
        class="inline-flex items-center justify-center w-7 h-7 rounded text-gray-400 dark:text-gray-600 cursor-default"
        aria-label="Transaction already reversed">
    <i class="fas fa-undo text-xs"></i>
  </span>
  {% endif %}
{% endif %}
